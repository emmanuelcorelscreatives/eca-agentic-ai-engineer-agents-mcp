[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eca-fictional-professional-twin"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
eca-twin = "twin:main"
eca-twin-ui = "app:main"

[tool.setuptools]
py-modules = ["twin", "workflow", "prompts", "context", "config", "status", "service", "tools", "storage", "notifications", "app", "agents_adapter", "pdf_ingest", "evaluate", "health"]

packages = ["twin_data"]

[tool.setuptools.package-data]
twin_data = ["*.json", "*.jsonl"]
