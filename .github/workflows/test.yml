name: Course practicals
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-practicals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/run_tests.py
      - run: python scripts/check_curriculum.py
